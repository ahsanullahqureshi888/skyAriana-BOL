<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Glacier Valley — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#0369a1">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#0369a1" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#0369a1" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0369a1" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0369a1" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0369a1" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0369a1" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#06b6d4" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0369a1" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0369a1" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0369a1" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0369a1" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#06b6d4" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0369a1" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0369a1" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0369a1" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0369a1" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#06b6d4" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0369a1" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0369a1" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0369a1" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0369a1" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#06b6d4" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Massive U-Shaped Glacial Valley & Flowing Ice Tongue -->
  <g fill="none" stroke="#0369a1">
    <!-- Flanking Glacial Cirque Walls on Both Sides -->
    <path d="M 60,420 L 220,540 L 240,780 L 160,1020 L 60,1180 Z" fill="#0369a1" fill-opacity="0.1" stroke="#0f172a" stroke-width="2.5" />
    <path d="M 840,440 L 680,560 L 660,800 L 740,1040 L 840,1190 Z" fill="#0369a1" fill-opacity="0.1" stroke="#0f172a" stroke-width="2.5" />

    <!-- Flowing Glacial Ice Tongue in Center (U-Shaped Floor) -->
    <path d="M 340,420 C 380,680 320,920 380,1320" stroke="#06b6d4" stroke-width="4" />
    <path d="M 560,420 C 520,680 580,920 520,1320" stroke="#06b6d4" stroke-width="4" />

    <!-- Medial Moraine Bands (Dark Rock Debris Lines down the Center) -->
    <path d="M 450,420 C 470,680 430,920 460,1320" stroke="#0f172a" stroke-width="3" stroke-dasharray="12 8" opacity="0.75" />

    <!-- Lateral Crevasses Arc Lines Across the Glacier Flow -->
    <g opacity="0.75">
      
        <path d="M 350,500 Q 450,475 550,500" stroke="#0369a1" stroke-width="2.2" />
      

        <path d="M 350,580 Q 450,555 550,580" stroke="#0369a1" stroke-width="2.0500000000000003" />
      

        <path d="M 350,680 Q 450,655 550,680" stroke="#0369a1" stroke-width="1.9000000000000001" />
      

        <path d="M 350,790 Q 450,765 550,790" stroke="#0369a1" stroke-width="1.7500000000000002" />
      

        <path d="M 350,910 Q 450,885 550,910" stroke="#0369a1" stroke-width="1.6" />
      

        <path d="M 350,1040 Q 450,1015 550,1040" stroke="#0369a1" stroke-width="1.4500000000000002" />
      

        <path d="M 350,1180 Q 450,1155 550,1180" stroke="#0369a1" stroke-width="1.3000000000000003" />
      
    </g>

    <!-- Glacial Survey Callout -->
    <g transform="translate(450, 310)">
      <circle cx="0" cy="0" r="85" stroke="#0369a1" stroke-width="1.8" />
      <text x="0" y="-12" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#0369a1" text-anchor="middle">FEDCHENKO GLACIER BASIN</text>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#06b6d4" text-anchor="middle">77 KM ICE CORRIDOR</text>
      <text x="0" y="24" font-family="Courier, monospace" font-size="7.5" font-weight="bold" fill="#0f172a" text-anchor="middle">GLACIOLOGICAL SURVEY · 4,200 M</text>
    </g>
  </g>
</svg>