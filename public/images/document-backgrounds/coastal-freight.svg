<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Coastal Freight — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#065f46">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#065f46" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#065f46" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#065f46" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0f766e" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#065f46" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#065f46" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#065f46" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0f766e" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#065f46" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0f766e" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#065f46" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#065f46" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#065f46" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0f766e" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#065f46" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0f766e" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#065f46" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#065f46" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#065f46" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0f766e" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#065f46" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0f766e" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#065f46" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#065f46" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#065f46" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0f766e" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Coastal Fjord, Feeder Vessel & Navigational Beacons -->
  <g fill="none" stroke="#065f46">
    <!-- Jagged Coastal Cliffs on Both Sides -->
    <!-- Left Cliff -->
    <path d="M 60,420 L 140,460 L 190,540 L 220,680 L 180,820 L 60,940 Z" fill="#065f46" fill-opacity="0.1" stroke="#065f46" stroke-width="2.5" />
    <!-- Right Headland -->
    <path d="M 840,480 L 760,520 L 700,620 L 720,780 L 840,880 Z" fill="#065f46" fill-opacity="0.1" stroke="#065f46" stroke-width="2.5" />

    <!-- Coastal Feeder Cargo Vessel Sailing Center-Down (Perspective Approach) -->
    <g transform="translate(450, 780) scale(1.1)" fill="#065f46" opacity="0.9">
      <!-- Vessel Bow View Approaching -->
      <path d="M 0,-80 L 35,-30 L 45,60 L 0,85 L -45,60 L -35,-30 Z" fill="#ffffff" stroke="#065f46" stroke-width="2.5" />
      <line x1="0" y1="-80" x2="0" y2="85" stroke="#065f46" stroke-width="2" />
      <!-- Cargo Hold Hatches with Containers -->
      <rect x="-28" y="-20" width="56" height="30" fill="#0f766e" fill-opacity="0.4" stroke="#065f46" stroke-width="1.2" />
      <rect x="-28" y="15" width="56" height="30" fill="#065f46" fill-opacity="0.3" stroke="#065f46" stroke-width="1.2" />
      <!-- Wheelhouse Superstructure at Stern -->
      <rect x="-24" y="48" width="48" height="24" fill="#ffffff" stroke="#065f46" stroke-width="1.5" />
      <line x1="0" y1="48" x2="0" y2="28" stroke="#065f46" stroke-width="2" />
      
      <!-- Powerful V-Shaped Bow Wave Wake -->
      <path d="M 0,-75 L 140,-10 L 260,80" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" fill="none" />
      <path d="M 0,-75 L -140,-10 L -260,80" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" fill="none" />
    </g>

    <!-- Coastal Sector Light Tower on Left Cliff (x = 220, y = 680) -->
    <g transform="translate(220, 680)">
      <polygon points="-8,0 8,0 4,-45 -4,-45" fill="#334155" stroke="#334155" stroke-width="1.5" />
      <circle cx="0" cy="-52" r="5" fill="#f59e0b" />
      <line x1="0" y1="-52" x2="160" y2="-40" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8" />
      <text x="10" y="-30" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#065f46">LIGHTHOUSE FL 5s</text>
    </g>

    <!-- Fjord Water Sinks & Depth Ribbons -->
    <g opacity="0.6">
      
        <path d="M 60,920 C 250,900 550,940 840,920" stroke="#0f766e" stroke-width="1.8" />
      

        <path d="M 60,980 C 250,960 550,1000 840,980" stroke="#0f766e" stroke-width="1.6" />
      

        <path d="M 60,1050 C 250,1030 550,1070 840,1050" stroke="#0f766e" stroke-width="1.4" />
      

        <path d="M 60,1130 C 250,1110 550,1150 840,1130" stroke="#0f766e" stroke-width="1.2" />
      

        <path d="M 60,1220 C 250,1200 550,1240 840,1220" stroke="#0f766e" stroke-width="1" />
      
    </g>

    <!-- Inshore Waybill Header Badge -->
    <g transform="translate(450, 310)">
      <circle cx="0" cy="0" r="85" stroke="#065f46" stroke-width="1.5" />
      <circle cx="0" cy="0" r="76" stroke="#0f766e" stroke-width="0.8" stroke-dasharray="4 4" />
      <text x="0" y="-12" font-family="Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="2" fill="#065f46" text-anchor="middle">COASTAL FEEDER NETWORK</text>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#0f766e" text-anchor="middle">INSHORE FREIGHT</text>
      <text x="0" y="24" font-family="Courier, monospace" font-size="7.5" font-weight="bold" fill="#334155" text-anchor="middle">REGIONAL SHORT-SEA TRANSIT</text>
    </g>
  </g>
</svg>