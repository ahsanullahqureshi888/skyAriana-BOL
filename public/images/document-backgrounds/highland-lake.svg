<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Highland Lake — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#1e3a8a">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#1e3a8a" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#1e3a8a" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e3a8a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#047857" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e3a8a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e3a8a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#047857" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e3a8a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#047857" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e3a8a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e3a8a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#047857" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e3a8a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#047857" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e3a8a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e3a8a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#047857" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e3a8a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#047857" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e3a8a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e3a8a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#047857" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Pristine High Alpine Glacier Lake & Mirrored Reflections -->
  <g fill="none" stroke="#1e3a8a">
    <!-- Mountain Ridges Encircling the Lake -->
    <path d="M 60,540 L 180,380 L 320,460 L 450,320 L 580,440 L 720,360 L 840,520 L 840,680 L 60,680 Z" fill="#1e3a8a" fill-opacity="0.1" stroke="#1e3a8a" stroke-width="2" />

    <!-- Highland Lake Water Surface (Waterline: y = 680 to 1180) -->
    <ellipse cx="450" cy="920" rx="360" ry="180" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-width="3" />
    <ellipse cx="450" cy="920" rx="280" ry="120" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="6 4" opacity="0.6" />

    <!-- Mirror Inverted Mountain Reflection on Water -->
    <path d="M 120,920 L 220,1020 L 340,960 L 450,1080 L 560,980 L 680,1040 L 780,920" stroke="#047857" stroke-width="1.8" opacity="0.6" stroke-dasharray="4 3" />

    <!-- Lake Title Seal -->
    <g transform="translate(450, 1260)">
      <rect x="-150" y="-16" width="300" height="32" fill="#ffffff" fill-opacity="0.9" rx="3" stroke="#1e3a8a" stroke-width="1.2" />
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#1e3a8a" text-anchor="middle">BAND-E AMIR HIGH ALPINE CRATER LAKE · ELEV 2,900 M</text>
    </g>
  </g>
</svg>