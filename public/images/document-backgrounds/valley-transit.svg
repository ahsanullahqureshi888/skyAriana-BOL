<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Valley Transit — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a16207" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a16207" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#854d0e">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#854d0e" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#854d0e" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#854d0e" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#a16207" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#854d0e" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#854d0e" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#854d0e" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#a16207" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#854d0e" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#a16207" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#854d0e" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#854d0e" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#854d0e" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#a16207" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#854d0e" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#a16207" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#854d0e" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#854d0e" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#854d0e" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#a16207" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#854d0e" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#a16207" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#854d0e" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#854d0e" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#854d0e" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#a16207" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Canyon River Valley & Modern Cable-Stayed Suspension Bridge -->
  <g fill="none" stroke="#854d0e">
    <!-- Canyon Walls on Both Sides -->
    <path d="M 60,340 L 220,440 L 180,680 L 280,880 L 120,1180 L 60,1240 Z" fill="#854d0e" fill-opacity="0.1" stroke="#854d0e" stroke-width="2" />
    <path d="M 840,360 L 680,460 L 720,690 L 620,890 L 780,1190 L 840,1240 Z" fill="#854d0e" fill-opacity="0.1" stroke="#854d0e" stroke-width="2" />

    <!-- Meandering Blue River in Valley Canyon Floor -->
    <path d="M 450,380 C 490,520 420,680 480,840 S 430,1080 450,1320" stroke="#0284c7" stroke-width="28" stroke-linecap="round" opacity="0.6" />
    <path d="M 450,380 C 490,520 420,680 480,840 S 430,1080 450,1320" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />

    <!-- Majestic Cable-Stayed Bridge Spanning Across the Canyon (y = 720) -->
    <g transform="translate(450, 720)">
      <!-- Bridge Roadway Deck -->
      <line x1="-320" y1="0" x2="320" y2="0" stroke="#854d0e" stroke-width="6" />
      <line x1="-320" y1="6" x2="320" y2="6" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 6" />

      <!-- Central Bridge Tower Pylon (A-Frame Pylon) -->
      <polygon points="0,-160 -18,40 18,40" fill="#ffffff" stroke="#854d0e" stroke-width="2.5" />
      <circle cx="0" cy="-165" r="5" fill="#0284c7" />

      <!-- Stay Cables Radiating from Tower to Deck -->
      
        <line x1="0" y1="-150" x2="-260" y2="0" stroke="#a16207" stroke-width="1.2" opacity="0.75" />
      

        <line x1="0" y1="-150" x2="-200" y2="0" stroke="#a16207" stroke-width="1.2" opacity="0.75" />
      

        <line x1="0" y1="-150" x2="-140" y2="0" stroke="#a16207" stroke-width="1.2" opacity="0.75" />
      

        <line x1="0" y1="-150" x2="-80" y2="0" stroke="#a16207" stroke-width="1.2" opacity="0.75" />
      

        <line x1="0" y1="-150" x2="80" y2="0" stroke="#a16207" stroke-width="1.2" opacity="0.75" />
      

        <line x1="0" y1="-150" x2="140" y2="0" stroke="#a16207" stroke-width="1.2" opacity="0.75" />
      

        <line x1="0" y1="-150" x2="200" y2="0" stroke="#a16207" stroke-width="1.2" opacity="0.75" />
      

        <line x1="0" y1="-150" x2="260" y2="0" stroke="#a16207" stroke-width="1.2" opacity="0.75" />
      

      <!-- Trucks Crossing the Bridge -->
      <rect x="-180" y="-18" width="45" height="16" fill="#a16207" stroke="#854d0e" rx="1" />
      <rect x="120" y="-18" width="45" height="16" fill="#a16207" stroke="#854d0e" rx="1" />
    </g>

    <!-- Valley Navigation Seal -->
    <g transform="translate(450, 280)">
      <circle cx="0" cy="0" r="75" stroke="#854d0e" stroke-width="1.5" />
      <text x="0" y="-8" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#854d0e" text-anchor="middle">RIVER CANYON TRANSIT</text>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#a16207" text-anchor="middle">VALLEY CORRIDOR</text>
    </g>
  </g>
</svg>