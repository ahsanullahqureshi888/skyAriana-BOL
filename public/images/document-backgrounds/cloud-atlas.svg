<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Cloud Atlas — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#0284c7">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#0284c7" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#0284c7" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0284c7" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1e40af" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0284c7" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0284c7" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0284c7" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1e40af" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0284c7" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1e40af" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0284c7" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0284c7" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0284c7" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1e40af" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0284c7" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1e40af" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0284c7" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0284c7" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0284c7" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1e40af" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0284c7" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1e40af" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0284c7" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0284c7" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0284c7" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1e40af" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Atmospheric Weather Chart & High-Altitude Isobars -->
  <g fill="none" stroke="#0284c7" opacity="0.6">
    <!-- Concentric Isobar Pressure Loops -->
    <path d="M 120,400 Q 250,320 450,330 T 780,420 Q 820,600 700,750 T 400,820 Q 200,800 150,650 Z" stroke-width="1.4" />
    <path d="M 180,430 Q 300,360 460,370 T 720,460 Q 760,590 660,700 T 410,760 Q 260,740 210,630 Z" stroke-width="0.9" stroke-dasharray="6 3" />
    <path d="M 240,460 Q 340,410 470,410 T 660,490 Q 690,570 610,650 T 430,690 Q 320,670 280,590 Z" stroke-width="1.2" />

    <!-- Jetstream Streamline Arrows -->
    <path d="M 80,680 C 220,550 380,560 520,480 S 780,380 840,320" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" />
    <path d="M 80,710 C 220,580 380,590 520,510 S 780,410 840,350" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.6" />
    <!-- Streamline Arrowheads -->
    <polygon points="840,320 815,325 825,340" fill="#38bdf8" opacity="0.8" />

    <!-- Pressure System & Altitude Badges -->
    <g transform="translate(460,520)" fill="#0284c7">
      <circle cx="0" cy="0" r="28" fill="#ffffff" fill-opacity="0.9" stroke="#0284c7" stroke-width="1.5" />
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" font-weight="900" text-anchor="middle" fill="#0284c7">H</text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#0284c7">1028 hPa</text>
    </g>

    <!-- Waypoint Crosshairs -->
    <g transform="translate(240,380)">
      <circle cx="0" cy="0" r="12" stroke-width="0.8" />
      <circle cx="0" cy="0" r="3" fill="#0284c7" />
      <line x1="-18" y1="0" x2="18" y2="0" stroke-width="0.8" />
      <line x1="0" y1="-18" x2="0" y2="18" stroke-width="0.8" />
      <rect x="18" y="-12" width="95" height="18" fill="#ffffff" fill-opacity="0.85" rx="2" stroke="#0284c7" stroke-width="0.6" />
      <text x="24" y="1" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#0284c7">WPT ALPHA · FL380</text>
    </g>
    <g transform="translate(680,620)">
      <circle cx="0" cy="0" r="12" stroke-width="0.8" />
      <circle cx="0" cy="0" r="3" fill="#0284c7" />
      <line x1="-18" y1="0" x2="18" y2="0" stroke-width="0.8" />
      <line x1="0" y1="-18" x2="0" y2="18" stroke-width="0.8" />
      <rect x="-115" y="-12" width="95" height="18" fill="#ffffff" fill-opacity="0.85" rx="2" stroke="#0284c7" stroke-width="0.6" />
      <text x="-110" y="1" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#0284c7">WPT BRAVO · 140KT</text>
    </g>

    <!-- Layered Cirrus Cloud Formations -->
    <g stroke="#1e40af" opacity="0.5" stroke-width="1.2">
      <path d="M 120,950 C 200,910 260,930 320,900 S 420,860 500,890 S 650,880 780,940" />
      <path d="M 160,980 C 240,940 300,960 380,930 S 480,910 560,930 S 700,920 800,980" stroke-dasharray="8 4" />
      <path d="M 100,1030 C 220,980 340,1020 460,970 S 620,960 760,1020" />
      <path d="M 140,1070 C 260,1030 380,1050 500,1020 S 660,1010 820,1070" stroke-dasharray="6 3" />
    </g>

    <!-- Cruising Cargo Aircraft Silhouette -->
    <g transform="translate(560,780) rotate(-15) scale(0.9)" fill="#1e40af" opacity="0.85">
      <path d="M 0,-80 C 8,-75 10,-40 10,-10 L 80,45 L 80,56 L 10,25 L 8,90 L 30,115 L 30,125 L 0,112 L -30,125 L -30,115 L -8,90 L -10,25 L -80,56 L -80,45 L -10,-10 C -10,-40 -8,-75 0,-80 Z" />
      <!-- Engine Pods -->
      <ellipse cx="40" cy="35" rx="5" ry="14" fill="#0284c7" />
      <ellipse cx="-40" cy="35" rx="5" ry="14" fill="#0284c7" />
      <!-- Contrails -->
      <line x1="40" y1="50" x2="40" y2="280" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />
      <line x1="-40" y1="50" x2="-40" y2="280" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />
    </g>
  </g>
</svg>