      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0369a1" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0284c7" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0369a1" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0369a1" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0369a1" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0369a1" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0284c7" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0369a1" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0369a1" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0369a1" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0369a1" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0284c7" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Sacred Geometry, Intersecting Polygons & Calipers -->
  <g fill="none" stroke="#0369a1">
    <!-- Concentric Golden Ratio Intersecting Polygons (Center: 450, 700) -->
    <g transform="translate(450, 700)" opacity="0.8">
      <!-- Hexagram & Octagram Stars -->
      <polygon points="260.0,0.0 130.0,225.2 -130.0,225.2 -260.0,0.0 -130.0,-225.2 130.0,-225.2" stroke="#0369a1" stroke-width="1.8" />
<polygon points="220.0,0.0 155.6,155.6 0.0,220.0 -155.6,155.6 -220.0,0.0 -155.6,-155.6 -0.0,-220.0 155.6,-155.6" stroke="#0284c7" stroke-width="1.6" />
<polygon points="180.0,0.0 90.0,155.9 -90.0,155.9 -180.0,0.0 -90.0,-155.9 90.0,-155.9" stroke="#0369a1" stroke-width="1.4" />
<polygon points="140.0,0.0 99.0,99.0 0.0,140.0 -99.0,99.0 -140.0,0.0 -99.0,-99.0 -0.0,-140.0 99.0,-99.0" stroke="#0284c7" stroke-width="1.2" />
<polygon points="100.0,0.0 50.0,86.6 -50.0,86.6 -100.0,0.0 -50.0,-86.6 50.0,-86.6" stroke="#0369a1" stroke-width="1" />

      <!-- Caliper Measurement Arcs -->
      <circle cx="0" cy="0" r="280" stroke="#0369a1" stroke-width="2" />
      <circle cx="0" cy="0" r="260" stroke="#334155" stroke-width="1" stroke-dasharray="4 3" />
      <line x1="-300" y1="0" x2="300" y2="0" stroke="#0369a1" stroke-width="1.5" />
