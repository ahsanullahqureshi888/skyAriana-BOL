      <circle cx="0" cy="0" r="4" fill="#0f766e" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0f766e" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#042f2e" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0f766e" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#042f2e" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0f766e" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0f766e" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0f766e" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#042f2e" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0f766e" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#042f2e" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0f766e" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0f766e" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0f766e" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#042f2e" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Coastal Headland, Lighthouse Beacon & Ocean Swells -->
  <g fill="none" stroke="#0f766e">
    <!-- Ocean Waterline Horizon (y: 920) -->
    <line x1="60" y1="920" x2="840" y2="920" stroke="#0f766e" stroke-width="1.8" opacity="0.6" />

    <!-- Rugged Rocky Cliff / Headland on the Right Flank -->
    <path d="M 520,920 L 550,860 L 590,870 L 620,810 L 680,820 L 730,760 L 840,770 L 840,1180 L 520,1180 Z" fill="#042f2e" fill-opacity="0.12" stroke="#042f2e" stroke-width="2.5" />
    <path d="M 550,860 L 580,940 M 620,810 L 650,920 M 730,760 L 760,880" stroke="#042f2e" stroke-width="1.2" opacity="0.5" />

    <!-- Majestic Lighthouse Tower on the Cliff Top (Base at x = 700, y = 760) -->
    <g transform="translate(700, 760)">
      <!-- Tapered Tower Masonry Body -->
      <polygon points="-32,0 32,0 18,-260 -18,-260" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" />
      
      <!-- Classic Nautical Red/Dark Masonry Stripes -->
      <polygon points="-29,-60 29,-60 25,-120 -25,-120" fill="#0f766e" fill-opacity="0.3" stroke="#0f766e" stroke-width="1.5" />
      <polygon points="-21,-180 21,-180 18,-240 -18,-240" fill="#0f766e" fill-opacity="0.3" stroke="#0f766e" stroke-width="1.5" />

      <!-- Tower Windows -->
      <rect x="-4" y="-45" width="8" height="14" fill="#0f766e" rx="4" />
      <rect x="-4" y="-155" width="8" height="14" fill="#0f766e" rx="4" />

      <!-- Gallery Balcony Platform -->
      <rect x="-26" y="-270" width="52" height="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5" rx="1" />
      <line x1="-24" y1="-278" x2="24" y2="-278" stroke="#0f766e" stroke-width="1.2" />

      <!-- Lantern Room & Glass Enclosure -->
      <rect x="-16" y="-300" width="32" height="30" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
      <line x1="0" y1="-300" x2="0" y2="-270" stroke="#0f766e" stroke-width="1" />

      <!-- Cupola Domed Roof & Lightning Spire -->
      <path d="M -16,-300 Q 0,-325 16,-300 Z" fill="#0f766e" stroke="#0f766e" stroke-width="2" />
      <line x1="0" y1="-325" x2="0" y2="-345" stroke="#0f766e" stroke-width="2" />
      <circle cx="0" cy="-348" r="3" fill="#d97706" />

      <!-- Glowing Fresnel Lens Lamp -->
      <circle cx="0" cy="-285" r="9" fill="#d97706" opacity="0.9" />

      <!-- Sweeping Radiant Light Beams Reaching Far Across the Bay to Left Margin -->
      <polygon points="0,-285 -640,-480 -640,-120" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.2" stroke-dasharray="6 4" />
      <polygon points="0,-285 -640,-220 -640,-20" fill="#d97706" fill-opacity="0.08" stroke="none" />
    </g>

    <!-- Ocean Swells & Crashing Surf in Bay Waters -->
    <g opacity="0.7">
      
        <path d="M 60,960 C 160,935 280,980 420,960 S 640,930 840,960" stroke="#0f766e" stroke-width="2" />
      

        <path d="M 60,1010 C 160,985 280,1030 420,1010 S 640,980 840,1010" stroke="#0f766e" stroke-width="1.8" />
      

        <path d="M 60,1070 C 160,1045 280,1090 420,1070 S 640,1040 840,1070" stroke="#0f766e" stroke-width="1.6" />
      

        <path d="M 60,1140 C 160,1115 280,1160 420,1140 S 640,1110 840,1140" stroke="#0f766e" stroke-width="1.4" />
      

        <path d="M 60,1220 C 160,1195 280,1240 420,1220 S 640,1190 840,1220" stroke="#0f766e" stroke-width="1.2" />
      

        <path d="M 60,1300 C 160,1275 280,1320 420,1300 S 640,1270 840,1300" stroke="#0f766e" stroke-width="1" />
      
      <!-- Foam details -->
      <path d="M 520,940 Q 560,910 600,940" stroke="#ffffff" stroke-width="2.5" />
      <path d="M 580,980 Q 640,950 700,980" stroke="#ffffff" stroke-width="2.5" />
    </g>

    <!-- Coastal Navigational Marker Buoy in Water (Left: x = 240, y = 1040) -->
    <g transform="translate(240, 1040)">
      <ellipse cx="0" cy="0" rx="35" ry="12" fill="#042f2e" fill-opacity="0.3" stroke="#0f766e" stroke-width="2" />
      <polygon points="-16,-10 16,-10 0,-70" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
      <circle cx="0" cy="-78" r="6" fill="#d97706" />
      <line x1="-30" y1="2" x2="30" y2="2" stroke="#0f766e" stroke-width="1.5" />
      <text x="0" y="24" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#0f766e" text-anchor="middle">BUOY 04 · FLASHING 4s</text>
    </g>

    <!-- Flying Seabirds (Gulls) in Distance -->
    
      <path d="M 326,520 Q 333,510 340,520 Q 347,510 354,520" stroke="#0f766e" stroke-width="1.5" opacity="0.75" />
    

      <path d="M 368.8,490 Q 374.4,482 380,490 Q 385.6,482 391.2,490" stroke="#0f766e" stroke-width="1.5" opacity="0.75" />
    

      <path d="M 423.2,540 Q 431.6,528 440,540 Q 448.4,528 456.8,540" stroke="#0f766e" stroke-width="1.5" opacity="0.75" />
    

      <path d="M 490.2,510 Q 495.1,503 500,510 Q 504.9,503 509.8,510" stroke="#0f766e" stroke-width="1.5" opacity="0.75" />
    

    <!-- Bay Coordinates & Harbor Seal -->
    <g transform="translate(320, 320)">
      <circle cx="0" cy="0" r="75" stroke="#0f766e" stroke-width="1.4" />
      <circle cx="0" cy="0" r="68" stroke="#d97706" stroke-width="0.8" stroke-dasharray="3 3" />
      <text x="0" y="-12" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#0f766e" text-anchor="middle">LIGHTHOUSE BAY</text>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#0f766e" text-anchor="middle">COASTAL BEACON</text>
      <text x="0" y="22" font-family="Courier, monospace" font-size="7" font-weight="bold" fill="#d97706" text-anchor="middle">RANGE 24 NM · FL W 10s</text>
    </g>
  </g>
</svg>