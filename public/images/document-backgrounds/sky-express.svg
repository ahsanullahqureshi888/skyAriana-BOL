<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Sky Express — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#1d4ed8">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#1d4ed8" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#1d4ed8" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1d4ed8" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1d4ed8" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1d4ed8" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1d4ed8" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#d97706" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1d4ed8" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1d4ed8" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1d4ed8" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1d4ed8" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#d97706" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1d4ed8" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1d4ed8" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1d4ed8" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1d4ed8" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#d97706" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1d4ed8" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1d4ed8" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1d4ed8" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1d4ed8" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#d97706" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Dynamic Express Air Freight Vector Artwork -->
  <g fill="none" stroke="#1d4ed8">
    <!-- High-Speed Dynamic Mach Streamlines -->
    <g opacity="0.65">
      
        <path d="M -40,1150 C 110,900 310,650 610,300" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="12 6" />
      

        <path d="M 10,1150 C 160,900 360,650 660,300" stroke="#d97706" stroke-width="1.7" stroke-dasharray="none" />
      

        <path d="M 60,1150 C 210,900 410,650 710,300" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="none" />
      

        <path d="M 110,1150 C 260,900 460,650 760,300" stroke="#d97706" stroke-width="1.2" stroke-dasharray="12 6" />
      

        <path d="M 160,1150 C 310,900 510,650 810,300" stroke="#1d4ed8" stroke-width="1.7" stroke-dasharray="none" />
      

        <path d="M 210,1150 C 360,900 560,650 860,300" stroke="#d97706" stroke-width="2.2" stroke-dasharray="none" />
      

        <path d="M 260,1150 C 410,900 610,650 910,300" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="12 6" />
      
    </g>

    <!-- Cargo Express Speed Chevrons -->
    <g transform="translate(450, 280)" fill="#d97706" opacity="0.8">
      <polygon points="-80,-20 -50,0 -80,20 -60,20 -30,0 -60,-20" />
      <polygon points="-30,-20 0,0 -30,20 -10,20 20,0 -10,-20" />
      <polygon points="20,-20 50,0 20,20 40,20 70,0 40,-20" />
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="4" fill="#1d4ed8" text-anchor="middle">INTERNATIONAL AIR EXPRESS LOGISTICS</text>
    </g>

    <!-- Intercontinental Great-Circle Route Arcs -->
    <g opacity="0.5">
      <path d="M 80,750 Q 450,450 820,750" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="8 5" />
      <path d="M 80,820 Q 450,550 820,820" stroke="#d97706" stroke-width="1.2" />
    </g>

    <!-- Prominent Angled Supersonic Cargo Jet (3/4 Perspective Banking Ascent) -->
    <g transform="translate(450, 640) rotate(-28) scale(1.2)" fill="#1d4ed8" opacity="0.9">
      <!-- Main Fuselage Body -->
      <path d="M 0,-130 C 14,-120 18,-70 18,-10 L 140,65 L 140,80 L 18,40 L 14,140 L 48,180 L 48,195 L 0,175 L -48,195 L -48,180 L -14,140 L -18,40 L -140,80 L -140,65 L -18,-10 C -18,-70 -14,-120 0,-130 Z" />
      
      <!-- Express Winglets -->
      <path d="M 140,65 L 146,45 L 138,55 Z" fill="#d97706" />
      <path d="M -140,65 L -146,45 L -138,55 Z" fill="#d97706" />

      <!-- Twin Jet Engine Nacelles -->
      <ellipse cx="60" cy="50" rx="8" ry="24" fill="#d97706" />
      <ellipse cx="-60" cy="50" rx="8" ry="24" fill="#d97706" />

      <!-- Speed Vortex Lines from Wingtips & Engines -->
      <line x1="140" y1="80" x2="140" y2="350" stroke="#d97706" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" />
      <line x1="-140" y1="80" x2="-140" y2="350" stroke="#d97706" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" />
      <line x1="60" y1="74" x2="60" y2="380" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="12 8" opacity="0.8" />
      <line x1="-60" y1="74" x2="-60" y2="380" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="12 8" opacity="0.8" />
    </g>

    <!-- Cargo Tie-down Security Frame & Priority Seal in Lower Zone -->
    <g transform="translate(450, 1080)">
      <rect x="-180" y="-45" width="360" height="90" fill="#ffffff" fill-opacity="0.9" rx="4" stroke="#1d4ed8" stroke-width="1.5" />
      <rect x="-174" y="-39" width="348" height="78" rx="2" stroke="#d97706" stroke-width="0.8" stroke-dasharray="4 3" />
      <text x="0" y="-15" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="3" fill="#1d4ed8" text-anchor="middle">AIR CARGO PRIORITY WAYBILL ROUTE</text>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#d97706" text-anchor="middle">TRANSIT GUARANTEED · SCHEDULED FLIGHT NETWORK</text>
      <text x="0" y="24" font-family="Courier, monospace" font-size="8.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">KBL ✈ DXB ✈ IST ✈ FRA ✈ ORD</text>
    </g>
  </g>
</svg>