        <line x1="-50" y1="0" x2="50" y2="0" stroke="#f59e0b" stroke-width="2" />
        <!-- PAPI 4-light bar: 2 red, 2 white for on-glideslope -->
        <circle cx="-65" cy="0" r="3.5" fill="#ef4444" stroke="#312e81" />
        <circle cx="-75" cy="0" r="3.5" fill="#ef4444" stroke="#312e81" />
        <circle cx="-85" cy="0" r="3.5" fill="#ffffff" stroke="#312e81" />
        <circle cx="-95" cy="0" r="3.5" fill="#ffffff" stroke="#312e81" />
      </g>

