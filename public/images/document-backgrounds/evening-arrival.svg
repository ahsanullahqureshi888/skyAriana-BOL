      <circle cx="0" cy="30" r="3.5" fill="#f59e0b" />
      <rect x="35" y="40" width="3" height="18" fill="#0284c7" />
      <ellipse cx="36" cy="60" rx="5" ry="3" fill="#f59e0b" />
      <rect x="-38" y="40" width="3" height="18" fill="#0284c7" />
      <ellipse cx="-37" cy="60" rx="5" ry="3" fill="#f59e0b" />
    </g>

    <!-- Night Approach Badge -->
