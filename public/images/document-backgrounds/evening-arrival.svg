          <circle cx="28.000000000000004" cy="0" r="3.5" fill="#f59e0b" stroke="#312e81" />
          <line x1="-18.000000000000004" y1="0" x2="11.999999999999996" y2="0" stroke="#ffffff" stroke-width="2" />
          <line x1="-11.999999999999996" y1="0" x2="18.000000000000004" y2="0" stroke="#ffffff" stroke-width="2" />
        </g>
<g transform="translate(450, 740)">
          <circle cx="-61.60000000000001" cy="0" r="3.5" fill="#f59e0b" stroke="#312e81" />
          <circle cx="61.60000000000001" cy="0" r="3.5" fill="#f59e0b" stroke="#312e81" />
          <line x1="-51.60000000000001" y1="0" x2="-21.60000000000001" y2="0" stroke="#ffffff" stroke-width="2" />
          <line x1="21.60000000000001" y1="0" x2="51.60000000000001" y2="0" stroke="#ffffff" stroke-width="2" />
        </g>
<g transform="translate(450, 880)">
          <circle cx="-100.80000000000001" cy="0" r="3.5" fill="#f59e0b" stroke="#312e81" />
          <circle cx="100.80000000000001" cy="0" r="3.5" fill="#f59e0b" stroke="#312e81" />
          <line x1="-90.80000000000001" y1="0" x2="-60.80000000000001" y2="0" stroke="#ffffff" stroke-width="2" />
          <line x1="60.80000000000001" y1="0" x2="90.80000000000001" y2="0" stroke="#ffffff" stroke-width="2" />
        </g>
<g transform="translate(450, 1040)">
          <circle cx="-145.60000000000002" cy="0" r="3.5" fill="#f59e0b" stroke="#312e81" />
          <circle cx="145.60000000000002" cy="0" r="3.5" fill="#f59e0b" stroke="#312e81" />
          <line x1="-135.60000000000002" y1="0" x2="-105.60000000000002" y2="0" stroke="#ffffff" stroke-width="2" />
          <line x1="105.60000000000002" y1="0" x2="135.60000000000002" y2="0" stroke="#ffffff" stroke-width="2" />
        </g>
<g transform="translate(450, 1220)">
          <circle cx="-196.00000000000003" cy="0" r="3.5" fill="#f59e0b" stroke="#312e81" />
          <circle cx="196.00000000000003" cy="0" r="3.5" fill="#f59e0b" stroke="#312e81" />
          <line x1="-186.00000000000003" y1="0" x2="-156.00000000000003" y2="0" stroke="#ffffff" stroke-width="2" />
          <line x1="156.00000000000003" y1="0" x2="186.00000000000003" y2="0" stroke="#ffffff" stroke-width="2" />
        </g>
    </g>

    <!-- Heavy Transport Aircraft on Final Approach (Landing Gear Down) -->
    <g transform="translate(450, 420) scale(1.2)" fill="#312e81" opacity="0.95">
      <!-- Fuselage -->
      <path d="M 0,-60 C 9,-55 12,-30 12,-5 L 100,35 L 100,45 L 12,22 L 10,70 L 32,92 L 32,100 L 0,88 L -32,100 L -32,92 L -10,70 L -12,22 L -100,45 L -100,35 L -12,-5 C -12,-30 -9,-55 0,-60 Z" />
      
      <!-- Extended Flaps Line -->
      <line x1="25" y1="30" x2="85" y2="44" stroke="#f59e0b" stroke-width="1.8" />
      <line x1="-25" y1="30" x2="-85" y2="44" stroke="#f59e0b" stroke-width="1.8" />

      <!-- Deployed Landing Gear (Nose + Main Wheels) -->
