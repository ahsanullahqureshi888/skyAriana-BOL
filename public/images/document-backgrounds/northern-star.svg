      <circle cx="0" cy="0" r="260" stroke="#0f172a" stroke-width="2.5" />
      <circle cx="0" cy="0" r="240" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="180" stroke="#0f172a" stroke-width="1.2" />
      <circle cx="0" cy="0" r="100" stroke="#d97706" stroke-width="1.2" />
