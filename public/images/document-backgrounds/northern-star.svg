      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0f172a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1e3a8a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0f172a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0f172a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1e3a8a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0f172a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Celestial Polaris Zenith, Armillary Rings & Constellation Map -->
  <g fill="none" stroke="#0f172a">
    <!-- Center: Celestial Zenith Polaris (450, 680) -->
    <g transform="translate(450, 680)">
      <!-- Giant Radiant 8-Point Polaris Star -->
      
          <polygon points="0,0 34.8,-3.7 240.0,0.0" fill="#d97706" />
          <polygon points="0,0 34.8,3.7 240.0,0.0" fill="#ffffff" stroke="#0f172a" stroke-width="0.8" />
        

          <polygon points="0,0 27.2,22.0 113.1,113.1" fill="#1e3a8a" />
          <polygon points="0,0 22.0,27.2 113.1,113.1" fill="#ffffff" stroke="#0f172a" stroke-width="0.8" />
        

