          <polygon points="0,0 -3.7,34.8 0.0,240.0" fill="#ffffff" stroke="#0f172a" stroke-width="0.8" />
        

          <polygon points="0,0 -22.0,27.2 -113.1,113.1" fill="#1e3a8a" />
          <polygon points="0,0 -27.2,22.0 -113.1,113.1" fill="#ffffff" stroke="#0f172a" stroke-width="0.8" />
        

