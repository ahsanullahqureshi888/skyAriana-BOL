      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0891b2" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#172554" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0891b2" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#172554" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#172554" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#172554" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0891b2" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Nautical Chart Strait, Bathymetry & Fairway Channel -->
  <g fill="none" stroke="#172554">
    <!-- Archipelago Island Landmasses (Hachured Land Shading) -->
    <!-- Island North-West -->
    <path d="M 60,340 C 140,320 220,380 280,450 C 320,500 290,620 200,680 C 120,720 70,640 60,540 Z" fill="#172554" fill-opacity="0.1" stroke="#172554" stroke-width="2.5" />
    <text x="160" y="520" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#172554">NORTH ISLAND</text>

    <!-- Island South-East -->
    <path d="M 640,680 C 720,620 810,650 840,720 L 840,1080 C 780,1120 710,1060 660,980 C 600,900 580,750 640,680 Z" fill="#172554" fill-opacity="0.1" stroke="#172554" stroke-width="2.5" />
    <text x="710" y="860" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#172554">SOUTH REEF</text>

    <!-- Bathymetric Depth Sounding Contour Isolines -->
    <g opacity="0.6">
      <!-- 10m Depth Line -->
      <path d="M 60,280 C 180,260 290,340 360,450 C 410,540 370,720 240,790 C 140,840 80,760 60,680" stroke="#0891b2" stroke-width="1.4" stroke-dasharray="8 4" />
      <text x="320" y="420" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#0891b2">10 M</text>

      <!-- 25m Depth Line -->
      <path d="M 120,200 C 260,210 390,310 450,480 C 510,650 460,860 320,960 C 220,1020 120,950 60,860" stroke="#0891b2" stroke-width="1.8" />
      <text x="430" y="460" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#0891b2">25 M</text>

      <!-- 50m Deep Channel Trench -->
      <path d="M 220,120 C 350,180 480,310 540,540 C 600,760 560,1020 420,1180" stroke="#172554" stroke-width="2.2" />
      <text x="520" y="520" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#172554">50 M FAIRWAY</text>
    </g>

    <!-- Navigable Fairway Channel Navigation Route (Green Starboard & Red Port Markers) -->
    <!-- Leading Line Centerline -->
    <line x1="180" y1="180" x2="680" y2="1240" stroke="#172554" stroke-width="2.5" stroke-dasharray="14 8" />
    <text x="480" y="790" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#172554" transform="rotate(48 480 790)">BEARING 048° TRUE · DEEP DRAFT FAIRWAY</text>

    <!-- Lateral Channel Marker Buoys along Fairway -->
    <!-- Port Mark 1 (Red Can) -->
    <g transform="translate(380, 540)">
      <rect x="-10" y="-18" width="20" height="18" fill="#ef4444" stroke="#172554" stroke-width="1.2" />
      <text x="14" y="-4" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#ef4444">Q.R 1s (PORT)</text>
    </g>
    <!-- Starboard Mark 1 (Green Conical) -->
    <g transform="translate(490, 680)">
      <polygon points="0,-22 12,0 -12,0" fill="#10b981" stroke="#172554" stroke-width="1.2" />
      <text x="16" y="-4" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#10b981">Q.G 1s (STBD)</text>
    </g>

    <!-- Spot Soundings Numbers in Water Basin -->
    
      <text x="380" y="380" font-family="Courier, monospace" font-size="8.5" font-weight="bold" fill="#0891b2" opacity="0.8">32</text>
    

      <text x="420" y="440" font-family="Courier, monospace" font-size="8.5" font-weight="bold" fill="#0891b2" opacity="0.8">44</text>
    

      <text x="460" y="520" font-family="Courier, monospace" font-size="8.5" font-weight="bold" fill="#0891b2" opacity="0.8">52</text>
    

      <text x="520" y="640" font-family="Courier, monospace" font-size="8.5" font-weight="bold" fill="#0891b2" opacity="0.8">48</text>
    

      <text x="560" y="720" font-family="Courier, monospace" font-size="8.5" font-weight="bold" fill="#0891b2" opacity="0.8">38</text>
    

      <text x="420" y="680" font-family="Courier, monospace" font-size="8.5" font-weight="bold" fill="#0891b2" opacity="0.8">28</text>
    

      <text x="340" y="620" font-family="Courier, monospace" font-size="8.5" font-weight="bold" fill="#0891b2" opacity="0.8">19</text>
    

      <text x="580" y="840" font-family="Courier, monospace" font-size="8.5" font-weight="bold" fill="#0891b2" opacity="0.8">42</text>
    

      <text x="620" y="920" font-family="Courier, monospace" font-size="8.5" font-weight="bold" fill="#0891b2" opacity="0.8">54</text>
    

    <!-- Large Ornate Nautical Compass Rose in Lower Left -->
    <g transform="translate(240, 1080)">
      <circle cx="0" cy="0" r="110" stroke="#172554" stroke-width="1.5" />
      <circle cx="0" cy="0" r="102" stroke="#0891b2" stroke-width="0.8" stroke-dasharray="3 3" />
      <circle cx="0" cy="0" r="60" stroke="#172554" stroke-width="0.9" />
      <!-- 8-Point Compass Star -->
      <polygon points="0,0 -8,-15 0,-95 8,-15" fill="#172554" />
      <polygon points="0,0 8,-15 0,-95" fill="#0891b2" />
      <polygon points="0,0 15,-8 95,0 15,8" fill="#172554" />
      <polygon points="0,0 -8,15 0,95 8,15" fill="#172554" />
      <polygon points="0,0 -15,-8 -95,0 -15,8" fill="#172554" />
      <text x="0" y="-105" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#172554" text-anchor="middle">N</text>
      <text x="112" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172554">E</text>
      <text x="0" y="118" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172554" text-anchor="middle">S</text>
      <text x="-120" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172554">W</text>
    </g>
