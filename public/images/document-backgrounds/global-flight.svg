      <path d="M 0,-80 C 8,-75 10,-40 10,-10 L 85,45 L 85,55 L 10,25 L 8,85 L 28,110 L 28,118 L 0,108 L -28,118 L -28,110 L -8,85 L -10,25 L -85,55 L -85,45 L -10,-10 C -10,-40 -8,-75 0,-80 Z" />
