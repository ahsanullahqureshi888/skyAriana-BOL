<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Cargo Convoy — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#1e40af">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#1e40af" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#1e40af" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e40af" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e40af" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e40af" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e40af" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#2563eb" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e40af" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e40af" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e40af" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e40af" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#2563eb" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e40af" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e40af" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e40af" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e40af" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#2563eb" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e40af" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e40af" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e40af" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e40af" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#2563eb" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Heavy Logistics Road Freight Convoy in Tight Formation -->
  <g fill="none" stroke="#1e40af">
    <!-- Multi-Lane Modern Freight Highway Receding into Distance -->
    <line x1="450" y1="460" x2="140" y2="1320" stroke="#1e40af" stroke-width="3" />
    <line x1="450" y1="460" x2="760" y2="1320" stroke="#1e40af" stroke-width="3" />
    <line x1="450" y1="460" x2="450" y2="1320" stroke="#2563eb" stroke-width="2" stroke-dasharray="16 12" />

    <!-- Three Heavy Logistics Semi-Trailers in Tight Convoy (Staggered Lanes) -->
    <!-- Truck 1 (Lead Truck: Center-Right x = 520, y = 680) -->
    <g transform="translate(520, 680) scale(0.9)" fill="#1e40af">
      <rect x="-30" y="-50" width="60" height="48" rx="2" fill="#ffffff" stroke="#1e40af" stroke-width="2" />
      <rect x="-24" y="-45" width="48" height="20" fill="#1e40af" fill-opacity="0.3" />
      <circle cx="-18" cy="-10" r="4" fill="#d97706" />
      <circle cx="18" cy="-10" r="4" fill="#d97706" />
    </g>

    <!-- Truck 2 (Second Truck: Center-Left x = 360, y = 840) -->
    <g transform="translate(360, 840) scale(1.1)" fill="#1e40af">
      <rect x="-32" y="-55" width="64" height="52" rx="3" fill="#ffffff" stroke="#1e40af" stroke-width="2.5" />
      <rect x="-26" y="-50" width="52" height="22" fill="#2563eb" fill-opacity="0.3" />
      <circle cx="-20" cy="-12" r="4.5" fill="#d97706" />
      <circle cx="20" cy="-12" r="4.5" fill="#d97706" />
      <!-- Headlight Beam Projections Forward -->
      <polygon points="-20,-12 -80,-120 40,-120 20,-12" fill="#d97706" fill-opacity="0.08" stroke="none" />
    </g>

    <!-- Truck 3 (Third Truck: Center-Right x = 560, y = 1040) -->
    <g transform="translate(560, 1040) scale(1.3)" fill="#1e40af">
      <rect x="-35" y="-60" width="70" height="58" rx="3" fill="#ffffff" stroke="#1e40af" stroke-width="3" />
      <rect x="-28" y="-54" width="56" height="25" fill="#1e40af" fill-opacity="0.3" />
      <circle cx="-22" cy="-14" r="5" fill="#d97706" />
      <circle cx="22" cy="-14" r="5" fill="#d97706" />
      <text x="0" y="-36" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#1e40af" text-anchor="middle">CONVOY 3</text>
    </g>

    <!-- Convoy Operations Control Seal -->
    <g transform="translate(450, 280)">
      <circle cx="0" cy="0" r="85" stroke="#1e40af" stroke-width="1.5" />
      <text x="0" y="-12" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#1e40af" text-anchor="middle">SECURE CARGO CONVOY</text>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#2563eb" text-anchor="middle">HIGHWAY ESCORT FLEET</text>
      <text x="0" y="22" font-family="Courier, monospace" font-size="7" font-weight="bold" fill="#d97706" text-anchor="middle">GPS TRACKED · DISPATCH VERIFIED</text>
    </g>
  </g>
</svg>