<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Border Crossing — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#1e3a8a">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#1e3a8a" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#1e3a8a" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e3a8a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0f172a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e3a8a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e3a8a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e3a8a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0f172a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e3a8a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e3a8a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e3a8a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0f172a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e3a8a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e3a8a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e3a8a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#0f172a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e3a8a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e3a8a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e3a8a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- International Customs Border Terminal (Islam Qala / Torghundi) -->
  <g fill="none" stroke="#1e3a8a">
    <!-- Customs Multi-Lane Overhead Inspection Canopy (Center: x = 450, y = 620) -->
    <g transform="translate(450, 620)">
      <!-- Massive Overhead Steel Canopy Roof Truss -->
      <rect x="-280" y="-90" width="560" height="30" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2" rx="2" />
      <text x="0" y="-70" font-family="Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="4" fill="#ffffff" text-anchor="middle">INTERNATIONAL CUSTOMS BORDER TERMINAL</text>
      
      <!-- Support Columns (4 Pillars Creating 3 Lanes) -->
      
        <rect x="-246" y="-60" width="12" height="180" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
        <rect x="-252" y="110" width="24" height="14" fill="#1e3a8a" rx="1" />
      

        <rect x="-86" y="-60" width="12" height="180" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
        <rect x="-92" y="110" width="24" height="14" fill="#1e3a8a" rx="1" />
      

        <rect x="74" y="-60" width="12" height="180" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
        <rect x="68" y="110" width="24" height="14" fill="#1e3a8a" rx="1" />
      

        <rect x="234" y="-60" width="12" height="180" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
        <rect x="228" y="110" width="24" height="14" fill="#1e3a8a" rx="1" />
      

      <!-- Lane Badges & Traffic Signals Above Each Lane -->
      <!-- Lane 1 (Commercial TIR) -->
      <g transform="translate(-160, -45)">
        <rect x="-45" y="0" width="90" height="18" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.2" rx="2" />
        <text x="0" y="13" font-family="Arial, sans-serif" font-size="7.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">LANE 1 · TIR CARGO</text>
        <circle cx="0" cy="28" r="5" fill="#10b981" />
      </g>
      <!-- Lane 2 (Heavy Intermodal) -->
      <g transform="translate(0, -45)">
        <rect x="-45" y="0" width="90" height="18" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.2" rx="2" />
        <text x="0" y="13" font-family="Arial, sans-serif" font-size="7.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">LANE 2 · CONTAINER</text>
        <circle cx="0" cy="28" r="5" fill="#10b981" />
      </g>
      <!-- Lane 3 (Express Transit) -->
      <g transform="translate(160, -45)">
        <rect x="-45" y="0" width="90" height="18" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.2" rx="2" />
        <text x="0" y="13" font-family="Arial, sans-serif" font-size="7.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">LANE 3 · INSPECTION</text>
        <circle cx="0" cy="28" r="5" fill="#10b981" />
      </g>

      <!-- Barrier Boom Gate Arms (Dashed Red/White Stripes) -->
      <line x1="-220" y1="55" x2="-100" y2="55" stroke="#ef4444" stroke-width="4" stroke-dasharray="14 10" />
      <line x1="-60" y1="55" x2="60" y2="55" stroke="#ef4444" stroke-width="4" stroke-dasharray="14 10" />
      <line x1="100" y1="55" x2="220" y2="55" stroke="#ef4444" stroke-width="4" stroke-dasharray="14 10" />
    </g>

    <!-- Customs Clearance Checkpoint Stamp & Station Badges in Upper Zone -->
    <g transform="translate(450, 320)">
      <circle cx="0" cy="0" r="95" stroke="#1e3a8a" stroke-width="2" />
      <circle cx="0" cy="0" r="85" stroke="#10b981" stroke-width="0.9" stroke-dasharray="4 3" />
      <circle cx="0" cy="0" r="48" fill="#10b981" fill-opacity="0.1" stroke="#1e3a8a" stroke-width="1.2" />
      <text x="0" y="-14" font-family="Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="2" fill="#1e3a8a" text-anchor="middle">CUSTOMS CLEARANCE VERIFIED</text>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">TORGHUNDI / ISLAM QALA</text>
      <text x="0" y="24" font-family="Courier, monospace" font-size="7.5" font-weight="bold" fill="#10b981" text-anchor="middle">ENTRY STATION CODE: AF-TRG-01</text>
    </g>

    <!-- Heavy Logistics Trucks Queued at Border Entry in Lower Half -->
    <g transform="translate(450, 940) scale(1.15)">
      <!-- Truck Lane 2 (Center) -->
      <rect x="-35" y="-45" width="70" height="85" rx="3" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
      <rect x="-30" y="-40" width="60" height="35" fill="#1e3a8a" fill-opacity="0.25" stroke="#1e3a8a" stroke-width="1" />
      <text x="0" y="-18" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#1e3a8a" text-anchor="middle">TIR</text>
      <circle cx="-22" cy="18" r="4.5" fill="#10b981" />
      <circle cx="22" cy="18" r="4.5" fill="#10b981" />

      <!-- Road markings -->
      <line x1="-120" y1="42" x2="120" y2="42" stroke="#0f172a" stroke-width="1.8" />
    </g>
  </g>
</svg>