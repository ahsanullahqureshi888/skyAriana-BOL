<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Meridian Grid — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#1e293b">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#1e293b" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#1e293b" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1d4ed8" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e293b" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e293b" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e293b" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1d4ed8" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1d4ed8" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e293b" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e293b" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e293b" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1d4ed8" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1d4ed8" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e293b" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e293b" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e293b" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1d4ed8" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1d4ed8" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e293b" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e293b" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e293b" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#1d4ed8" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Cartographic Coordinate Projection & Celestial Graticule -->
  <g fill="none" stroke="#1e293b">
    <!-- Center Celestial Sphere (450, 700) -->
    <g transform="translate(450, 700)" opacity="0.8">
      <!-- Outer Meridian Circle -->
      <circle cx="0" cy="0" r="280" stroke="#1e293b" stroke-width="3" />
      <circle cx="0" cy="0" r="265" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="4 3" />
      <circle cx="0" cy="0" r="200" stroke="#1e293b" stroke-width="1.2" />

      <!-- Curved Meridian Ellipses (Longitudes) -->
      
        <ellipse cx="0" cy="0" rx="60" ry="280" stroke="#1e293b" stroke-width="1.2" />
      

        <ellipse cx="0" cy="0" rx="120" ry="280" stroke="#1e293b" stroke-width="1.2" />
      

        <ellipse cx="0" cy="0" rx="180" ry="280" stroke="#1e293b" stroke-width="1.2" />
      

        <ellipse cx="0" cy="0" rx="240" ry="280" stroke="#1e293b" stroke-width="1.2" />
      

      <!-- Curved Parallel Ellipses (Latitudes) -->
      
        <ellipse cx="0" cy="0" rx="280" ry="60" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="6 4" />
      

        <ellipse cx="0" cy="0" rx="280" ry="120" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="6 4" />
      

        <ellipse cx="0" cy="0" rx="280" ry="180" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="6 4" />
      

        <ellipse cx="0" cy="0" rx="280" ry="240" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="6 4" />
      

      <!-- Equator & Prime Meridian Axis -->
      <line x1="-310" y1="0" x2="310" y2="0" stroke="#1e293b" stroke-width="2.5" />
      <line x1="0" y1="-310" x2="0" y2="310" stroke="#1e293b" stroke-width="2.5" />

      <!-- Coordinate Calibration Labels -->
      <text x="320" y="4" font-family="Courier, monospace" font-size="9" font-weight="bold" fill="#1d4ed8">0° EQUATOR</text>
      <text x="0" y="-318" font-family="Courier, monospace" font-size="9" font-weight="bold" fill="#1d4ed8" text-anchor="middle">90° N</text>
    </g>
  </g>
</svg>