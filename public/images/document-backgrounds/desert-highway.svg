    <!-- Long-Haul Freight Truck Approaching in Perspective (x = 450, y = 780) -->
    <g transform="translate(450, 780) scale(1.1)" fill="#b45309">
      <rect x="-35" y="-55" width="70" height="50" rx="3" fill="#ffffff" stroke="#b45309" stroke-width="2.5" />
