      <circle cx="0" cy="0" r="28" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#b45309" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#b45309" opacity="0.75" />
