<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Winding Pass — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#334155">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#334155" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#334155" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#334155" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#334155" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#334155" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#475569" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#334155" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#334155" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#334155" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#475569" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#334155" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#334155" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#334155" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#475569" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#334155" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#334155" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#334155" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#475569" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Serpentine Alpine Switchbacks (Salang Pass / Khyber Pass) -->
  <g fill="none" stroke="#334155">
    <!-- Towering Mountain Cliff Silhouettes -->
    <path d="M 60,380 L 160,280 L 280,340 L 450,220 L 620,320 L 760,260 L 840,360 L 840,560 L 60,560 Z" fill="#334155" fill-opacity="0.08" stroke="#334155" stroke-width="2" />

    <!-- Serpentine Switchback Hairpin Turns Carving the Mountainside -->
    <path d="M 120,1260 C 320,1260 520,1260 740,1200 C 820,1180 840,1120 760,1100 C 640,1080 320,1080 180,1020 C 100,990 110,930 200,910 C 360,880 620,880 740,820 C 810,790 800,730 720,710 C 580,680 340,680 220,630 C 150,600 180,540 280,520 C 400,500 540,500 680,480" stroke="#78350f" stroke-width="4.5" opacity="0.85" />
    <path d="M 120,1260 C 320,1260 520,1260 740,1200 C 820,1180 840,1120 760,1100 C 640,1080 320,1080 180,1020 C 100,990 110,930 200,910 C 360,880 620,880 740,820 C 810,790 800,730 720,710 C 580,680 340,680 220,630 C 150,600 180,540 280,520 C 400,500 540,500 680,480" stroke="#ffffff" stroke-width="1.4" stroke-dasharray="8 6" />

    <!-- Summit Tunnel Portal (x = 680, y = 480) -->
    <g transform="translate(680, 480)">
      <path d="M -30,0 L -30,-40 C -30,-60 30,-60 30,-40 L 30,0 Z" fill="#334155" stroke="#334155" stroke-width="2" />
      <text x="0" y="-70" font-family="Arial, sans-serif" font-size="8" font-weight="900" fill="#334155" text-anchor="middle">SALANG TUNNEL ELEV 3,400 M</text>
    </g>

    <!-- Elevation Profile Badges Along Turns -->
    <text x="780" y="1150" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#78350f">KM 42 · 1,850 M</text>
    <text x="140" y="970" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#78350f">KM 58 · 2,420 M</text>
    <text x="760" y="770" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#78350f">KM 74 · 2,980 M</text>
  </g>
</svg>