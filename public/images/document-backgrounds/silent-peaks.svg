<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Silent Peaks — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#0f172a">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#0f172a" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#0f172a" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0f172a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0f172a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#334155" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0f172a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0f172a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#334155" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0f172a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0f172a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#334155" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0f172a" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0f172a" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#0f172a" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#0f172a" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#334155" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- 4 Atmospheric Mountain Silhouette Ranges in Aerial Perspective -->
  <g fill="none" stroke="#0f172a">
    <!-- Range 1: Distant Twilight Silhouette (Faintest, Lightest) -->
    <polygon points="60,620 180,460 320,540 460,420 620,520 740,440 840,580 840,740 60,740" fill="#64748b" fill-opacity="0.08" stroke="#64748b" stroke-width="1.5" />

    <!-- Range 2: Mid-Distance Silhouette -->
    <polygon points="60,740 160,580 340,660 520,520 680,640 840,560 840,860 60,860" fill="#334155" fill-opacity="0.12" stroke="#334155" stroke-width="2" />

    <!-- Range 3: Near Mountain Ridge -->
    <polygon points="60,860 220,700 420,800 580,660 760,760 840,700 840,1020 60,1020" fill="#0f172a" fill-opacity="0.18" stroke="#0f172a" stroke-width="2.5" />

    <!-- Range 4: Foreground Granite Ridge (Darkest, Sharpest) -->
    <polygon points="60,1020 180,860 380,940 540,820 720,920 840,840 840,1320 60,1320" fill="#0f172a" fill-opacity="0.28" stroke="#0f172a" stroke-width="3" />

    <!-- Twilight Stars in Upper Sky -->
    <g opacity="0.6">
      <circle cx="180" cy="180" r="2" fill="#334155" />
<circle cx="280" cy="240" r="2" fill="#334155" />
<circle cx="420" cy="160" r="2" fill="#334155" />
<circle cx="580" cy="220" r="2" fill="#334155" />
<circle cx="720" cy="180" r="2" fill="#334155" />
<circle cx="800" cy="250" r="2" fill="#334155" />
    </g>
  </g>
