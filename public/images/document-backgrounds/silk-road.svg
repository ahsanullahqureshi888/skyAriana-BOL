<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="100%" height="100%">
  <title>Silk Road — Sky Ariana Logistics Security Watermark</title>
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="fade-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  
  <!-- Security Document Outer Border & Fine Calibrated Grid -->
  <g fill="none" stroke="#78350f">
    <!-- Primary Outer Frame -->
    <rect x="24" y="24" width="852" height="1352" rx="4" stroke-width="1.5" opacity="0.65" />
    <rect x="32" y="32" width="836" height="1336" rx="2" stroke-width="0.7" stroke-dasharray="5 3" opacity="0.5" />
    <rect x="42" y="42" width="816" height="1316" stroke-width="0.5" opacity="0.3" />

    <!-- Corner Alignment Crosshairs -->
    <path d="M16,40 L16,16 L40,16" stroke-width="2" opacity="0.8" />
    <path d="M884,40 L884,16 L860,16" stroke-width="2" opacity="0.8" />
    <path d="M16,1360 L16,1384 L40,1384" stroke-width="2" opacity="0.8" />
    <path d="M884,1360 L884,1384 L860,1384" stroke-width="2" opacity="0.8" />

    <!-- Top & Bottom Micro-Text Security Banners -->
    <text x="450" y="20" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#78350f" opacity="0.75">★ SKY ARIANA LOGISTICS · OFFICIAL MULTI-MODAL BILL OF LADING SECURITY SYSTEM ★</text>
    <text x="450" y="1390" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#78350f" opacity="0.75">★ AUTHENTIC SECURE CARGO WAYBILL · VERIFIED INTERNATIONAL TRANSIT NETWORK ★</text>

    <!-- Side Margin Degree & Metric Ticks -->
    <g opacity="0.4" stroke-width="0.6">
      <line x1="20" y1="350" x2="28" y2="350" /><line x1="20" y1="700" x2="30" y2="700" stroke-width="1.2" /><line x1="20" y1="1050" x2="28" y2="1050" />
      <line x1="872" y1="350" x2="880" y2="350" /><line x1="870" y1="700" x2="880" y2="700" stroke-width="1.2" /><line x1="872" y1="1050" x2="880" y2="1050" />
      <line x1="225" y1="20" x2="225" y2="28" /><line x1="450" y1="18" x2="450" y2="30" stroke-width="1.2" /><line x1="675" y1="20" x2="675" y2="28" />
      <line x1="225" y1="1372" x2="225" y2="1380" /><line x1="450" y1="1370" x2="450" y2="1382" stroke-width="1.2" /><line x1="675" y1="1372" x2="675" y2="1380" />
    </g>
  </g>
  <g transform="translate(75,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#78350f" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#78350f" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#78350f" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#78350f" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#b45309" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,75)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#78350f" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#78350f" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#78350f" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#78350f" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#b45309" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#78350f" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#78350f" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#78350f" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#78350f" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#b45309" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#78350f" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#78350f" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#78350f" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#78350f" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#b45309" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Ancient & Modern Trans-Eurasian Overland Silk Road Corridor -->
  <g fill="none" stroke="#78350f">
    <!-- Mountain Ridges in Upper Half (Hindu Kush & Pamir Passes) -->
    <path d="M 60,540 L 140,460 L 220,510 L 320,380 L 440,490 L 540,360 L 680,480 L 760,420 L 840,520 L 840,680 L 60,680 Z" fill="#78350f" fill-opacity="0.08" stroke="#78350f" stroke-width="2" />
    <path d="M 60,620 L 180,520 L 290,580 L 420,460 L 580,560 L 720,480 L 840,580" stroke="#b45309" stroke-width="1.2" stroke-dasharray="6 4" />

    <!-- Mountain Peaks Elevation Labels -->
    <text x="320" y="370" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#78350f" text-anchor="middle">SALANG PASS 3,878 M</text>
    <text x="540" y="350" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#78350f" text-anchor="middle">PAMIR HIGHWAY 4,655 M</text>

    <!-- Historic Silk Road Trade Hub Waypoints Across the Route -->
    
      <g transform="translate(120, 740)">
        <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#78350f" stroke-width="1.8" />
        <circle cx="0" cy="0" r="5" fill="#d97706" />
        <rect x="-45" y="18" width="90" height="20" fill="#ffffff" fill-opacity="0.9" rx="2" stroke="#b45309" stroke-width="0.8" />
        <text x="0" y="31" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#78350f" text-anchor="middle">HERAT OASIS</text>
      </g>
    

      <g transform="translate(280, 690)">
        <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#78350f" stroke-width="1.8" />
        <circle cx="0" cy="0" r="5" fill="#d97706" />
        <rect x="-45" y="18" width="90" height="20" fill="#ffffff" fill-opacity="0.9" rx="2" stroke="#b45309" stroke-width="0.8" />
        <text x="0" y="31" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#78350f" text-anchor="middle">BALKH TERMINAL</text>
      </g>
    

      <g transform="translate(450, 750)">
        <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#78350f" stroke-width="1.8" />
        <circle cx="0" cy="0" r="5" fill="#d97706" />
        <rect x="-45" y="18" width="90" height="20" fill="#ffffff" fill-opacity="0.9" rx="2" stroke="#b45309" stroke-width="0.8" />
        <text x="0" y="31" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#78350f" text-anchor="middle">KABUL JUNCTION</text>
      </g>
    

      <g transform="translate(620, 680)">
        <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#78350f" stroke-width="1.8" />
        <circle cx="0" cy="0" r="5" fill="#d97706" />
        <rect x="-45" y="18" width="90" height="20" fill="#ffffff" fill-opacity="0.9" rx="2" stroke="#b45309" stroke-width="0.8" />
        <text x="0" y="31" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#78350f" text-anchor="middle">SAMARKAND</text>
      </g>
    

      <g transform="translate(780, 740)">
        <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#78350f" stroke-width="1.8" />
        <circle cx="0" cy="0" r="5" fill="#d97706" />
        <rect x="-45" y="18" width="90" height="20" fill="#ffffff" fill-opacity="0.9" rx="2" stroke="#b45309" stroke-width="0.8" />
        <text x="0" y="31" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#78350f" text-anchor="middle">KASHGAR GATEWAY</text>
      </g>
    

    <!-- Winding Overland Trade Highway Spanning Between Hubs -->
    <path d="M 60,780 C 180,640 240,780 380,680 S 540,820 680,680 S 800,820 840,740" stroke="#d97706" stroke-width="3.5" opacity="0.8" />
    <path d="M 60,780 C 180,640 240,780 380,680 S 540,820 680,680 S 800,820 840,740" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="8 6" />

    <!-- Heritage Transition: Camel Caravan Silhouette Leading into Modern Heavy Freight Truck -->
    <!-- Bactrian Camels in Silhouette (Left: x = 180, y = 920) -->
    <g transform="translate(180, 920) scale(0.9)" fill="#78350f">
      <!-- Camel 1 -->
      <path d="M -80,0 L -75,-25 C -75,-40 -65,-45 -55,-40 L -50,-25 C -45,-38 -35,-38 -30,-25 L -20,-10 L -20,0 L -25,0 L -25,-15 L -40,-15 L -40,0 L -45,0 L -45,-15 L -65,-15 L -65,0 Z" />
      <!-- Camel 2 -->
      <path d="M -20,0 L -15,-25 C -15,-40 -5,-45 5,-40 L 10,-25 C 15,-38 25,-38 30,-25 L 40,-10 L 40,0 L 35,0 L 35,-15 L 20,-15 L 20,0 L 15,0 L 15,-15 L -5,-15 L -5,0 Z" />
      <text x="-20" y="24" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#78350f" text-anchor="middle">ANCIENT CARAVAN TRAIL</text>
    </g>

    <!-- Modern Articulated Logistics Tractor-Trailer (Right: x = 540, y = 920) -->
    <g transform="translate(540, 920) scale(1.1)" fill="#78350f">
      <!-- Semi-Trailer Box -->
      <rect x="-110" y="-55" width="130" height="45" rx="2" fill="#ffffff" stroke="#78350f" stroke-width="2" />
      <text x="-45" y="-28" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#78350f" text-anchor="middle">SKY ARIANA CARGO</text>
      <!-- Wheels Trailer -->
      <circle cx="-95" cy="-2" r="8" fill="#78350f" />
      <circle cx="-75" cy="-2" r="8" fill="#78350f" />
      <!-- Tractor Cab -->
      <path d="M 20,-10 L 20,-50 L 50,-50 L 62,-25 L 62,-10 Z" fill="#ffffff" stroke="#78350f" stroke-width="2" />
      <circle cx="35" cy="-2" r="8" fill="#78350f" />
      <circle cx="55" cy="-2" r="8" fill="#78350f" />
      <!-- Road line -->
      <line x1="-130" y1="6" x2="80" y2="6" stroke="#78350f" stroke-width="2" />
      <text x="-25" y="24" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#b45309" text-anchor="middle">MODERN INTERMODAL TRUCKING</text>
    </g>

    <!-- Silk Road Historic Title Seal in Lower Center -->
    <g transform="translate(450, 1180)">
      <circle cx="0" cy="0" r="85" stroke="#78350f" stroke-width="1.8" />
      <circle cx="0" cy="0" r="76" stroke="#b45309" stroke-width="0.8" stroke-dasharray="4 3" />
      <text x="0" y="-12" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#78350f" text-anchor="middle">GREAT SILK ROAD</text>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">TRANSIT CORRIDOR</text>
      <text x="0" y="22" font-family="Courier, monospace" font-size="7" font-weight="bold" fill="#d97706" text-anchor="middle">TI-R CARNET · VERIFIED TRANSIT</text>
    </g>
  </g>
</svg>