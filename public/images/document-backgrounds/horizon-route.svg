            <text x="22" y="0" font-family="Courier, monospace" font-size="7" font-weight="bold" fill="#ca8a04" text-anchor="middle">MP 200</text>
          </g>
        

          <g transform="translate(558.6, 840)">
            <rect x="0" y="-12" width="45" height="18" fill="#ffffff" stroke="#1e293b" stroke-width="1" rx="1" />
            <text x="22" y="0" font-family="Courier, monospace" font-size="7" font-weight="bold" fill="#ca8a04" text-anchor="middle">MP 150</text>
          </g>
        

