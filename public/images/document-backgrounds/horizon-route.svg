      <circle cx="0" cy="0" r="85" stroke="#1e293b" stroke-width="1.8" />
      <circle cx="0" cy="0" r="76" stroke="#ca8a04" stroke-width="0.8" stroke-dasharray="4 3" />
      <text x="0" y="-12" font-family="Arial, sans-serif" font-size="9" font-weight="900" letter-spacing="2" fill="#1e293b" text-anchor="middle">CONTINENTAL LOGISTICS ROUTE</text>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#1e293b" text-anchor="middle">HORIZON HIGHWAY</text>
      <text x="0" y="24" font-family="Courier, monospace" font-size="7.5" font-weight="bold" fill="#ca8a04" text-anchor="middle">DIRECT INTERMODAL TRANSIT</text>
