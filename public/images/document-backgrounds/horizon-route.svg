      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#334155" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(75,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e293b" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e293b" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e293b" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#334155" stroke-width="0.6" opacity="0.4" />
    </g><g transform="translate(825,1325)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.6" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1e293b" stroke-width="0.9" opacity="0.6" />
      <circle cx="0" cy="0" r="4" fill="#1e293b" opacity="0.75" />
      <path d="M-36,0 L36,0 M0,-36 L0,36" stroke="#1e293b" stroke-width="0.6" opacity="0.4" />
      <path d="M-24,-24 L24,24 M-24,24 L24,-24" stroke="#334155" stroke-width="0.6" opacity="0.4" />
    </g>


  <!-- Endless Open Plains & Distant Mountain Horizon -->
  <g fill="none" stroke="#1e293b">
    <!-- Distant Mountain Skyline on the Horizon (y: 620) -->
    <path d="M 60,620 L 140,580 L 240,610 L 360,560 L 450,590 L 580,540 L 720,600 L 840,570 L 840,620 L 60,620 Z" fill="#334155" fill-opacity="0.12" stroke="#334155" stroke-width="1.5" />

