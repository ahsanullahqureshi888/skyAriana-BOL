      <line x1="450" y1="620" x2="740" y2="1320" stroke="#1e293b" stroke-width="3" />
      <line x1="450" y1="620" x2="450" y2="1320" stroke="#ca8a04" stroke-width="3" stroke-dasharray="18 12" />

      <!-- Highway Distance Mileposts -->
      
          <g transform="translate(513, 720)">
