            <text x="22" y="0" font-family="Courier, monospace" font-size="7" font-weight="bold" fill="#ca8a04" text-anchor="middle">MP 50</text>
          </g>
        
    </g>

    <!-- Geographic Waypoint Grid Across Open Skies -->
    <g opacity="0.4" stroke-width="0.8">
      <line x1="60" y1="380" x2="840" y2="380" stroke-dasharray="10 6" />
      <text x="80" y="375" font-family="Courier, monospace" font-size="8" font-weight="bold" fill="#334155">LAT 34° 31' N · LON 69° 10' E · BEARING 270° TRUE</text>
